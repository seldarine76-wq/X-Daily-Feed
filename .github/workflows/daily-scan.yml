name: Daily crypto news scan

# Runs once per day at 14:00 UTC, and can also be triggered manually.
on:
  schedule:
    # Odd minutes avoid the top-of-hour congestion that makes GitHub drop runs.
    - cron: "9 12 * * *"    # primary ~12:09 UTC (= 13:09 BST)
    - cron: "49 12 * * *"   # backup ~12:49 UTC — only does work if the primary was dropped
  workflow_dispatch: {}     # lets you run it on demand from the Actions tab

# Allow the job to push the updated data/news.json back to the repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news scan
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # Manual runs always force a fresh scan; scheduled runs skip if today is done.
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python fetch_news.py

      - name: Commit updated news
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily news update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
